server {
    listen 80;
    listen [::]:80;
    server_name bastian-frese.info www.bastian-frese.info;

    root /var/www/labor;
    index index.html;

    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Kein add_header in den locations: sonst erben sie die Sicherheitsheader nicht.
    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    location /_astro/ {
        expires 30d;
        try_files $uri =404;
    }

    location /fonts/ {
        expires 30d;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/labor.access.log;
    error_log /var/log/nginx/labor.error.log;
}
