# ------------------------------------------------------------
# bastian-frese.info — manuell gepflegt, nicht in der NPM-Oberfläche
# Ziel: nginx in LXC 118 (192.168.100.5:80)
# ------------------------------------------------------------
server {
  set $forward_scheme http;
  set $server         "192.168.100.5";
  set $port           80;

  listen 80;
  listen [::]:80;
  listen 443 ssl;
  listen [::]:443 ssl;

  server_name bastian-frese.info;
  http2 on;

  include conf.d/include/letsencrypt-acme-challenge.conf;
  include conf.d/include/ssl-cache.conf;
  include conf.d/include/ssl-ciphers.conf;
  ssl_certificate /etc/letsencrypt/live/npm-18/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/npm-18/privkey.pem;

  include conf.d/include/block-exploits.conf;

  access_log /data/logs/proxy-host-labor_access.log proxy;
  error_log /data/logs/proxy-host-labor_error.log warn;

  location / {
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_http_version 1.1;
    include conf.d/include/proxy.conf;
  }

  include /data/nginx/custom/server_proxy[.]conf;
}
